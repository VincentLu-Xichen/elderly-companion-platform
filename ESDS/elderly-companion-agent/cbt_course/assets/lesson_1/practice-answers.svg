<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">练习案例参考答案</title>
  <desc id="desc">案例中的情境、想法、情绪和行为。</desc>
  <rect width="1200" height="600" rx="36" fill="#f7f1e4"/>
  <text x="72" y="78" fill="#1d4b3d" font-family="sans-serif" font-size="38" font-weight="700">把四个部分放回三角里</text>
  <g font-family="sans-serif">
    <g transform="translate(72 118)">
      <rect width="1056" height="94" rx="22" fill="#fff"/>
      <text x="34" y="42" fill="#9b6b22" font-size="20" font-weight="700">情境</text>
      <text x="134" y="59" fill="#2e433b" font-size="26">别人和我说话或打招呼，而我一时没想到合适的话</text>
    </g>
    <g transform="translate(72 232)">
      <rect width="1056" height="118" rx="22" fill="#fff"/>
      <text x="34" y="42" fill="#9b6b22" font-size="20" font-weight="700">想法</text>
      <text x="134" y="48" fill="#2e433b" font-size="25">不回应会让对方觉得我不礼貌、没兴趣，</text>
      <text x="134" y="84" fill="#2e433b" font-size="25">还会影响我们的关系</text>
    </g>
    <g transform="translate(72 370)">
      <rect width="1056" height="76" rx="22" fill="#fff"/>
      <text x="34" y="45" fill="#9b6b22" font-size="20" font-weight="700">情绪</text>
      <text x="134" y="49" fill="#2e433b" font-size="26">紧张</text>
    </g>
    <g transform="translate(72 466)">
      <rect width="1056" height="76" rx="22" fill="#fff"/>
      <text x="34" y="45" fill="#9b6b22" font-size="20" font-weight="700">行为</text>
      <text x="134" y="49" fill="#2e433b" font-size="26">拼命想和人说话</text>
    </g>
  </g>
</svg>
