<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">八节认知行为课程概览</title>
  <desc id="desc">从认知行为三角到预防复发的八节课程路径。</desc>
  <rect width="1200" height="620" rx="36" fill="#f7f1e4"/>
  <text x="72" y="82" fill="#1d4b3d" font-family="sans-serif" font-size="40" font-weight="700">八节课，一步一步认识自己</text>
  <text x="74" y="124" fill="#60756d" font-family="sans-serif" font-size="22">从看见想法、情绪与行为的联系开始</text>
  <g font-family="sans-serif" font-size="23">
    <g transform="translate(72 164)">
      <rect width="500" height="82" rx="20" fill="#dce9df"/>
      <circle cx="48" cy="41" r="24" fill="#2f6a55"/>
      <text x="41" y="49" fill="#fff" font-weight="700">1</text>
      <text x="88" y="49" fill="#173e33" font-weight="700">认知行为三角</text>
    </g>
    <g transform="translate(628 164)">
      <rect width="500" height="82" rx="20" fill="#efe5c8"/>
      <circle cx="48" cy="41" r="24" fill="#b7852f"/>
      <text x="41" y="49" fill="#fff" font-weight="700">2</text>
      <text x="88" y="49" fill="#57431d">捕捉我的思维</text>
    </g>
    <g transform="translate(72 270)">
      <rect width="500" height="82" rx="20" fill="#efe5c8"/>
      <circle cx="48" cy="41" r="24" fill="#b7852f"/>
      <text x="41" y="49" fill="#fff" font-weight="700">3</text>
      <text x="88" y="49" fill="#57431d">识别歪曲思维</text>
    </g>
    <g transform="translate(628 270)">
      <rect width="500" height="82" rx="20" fill="#efe5c8"/>
      <circle cx="48" cy="41" r="24" fill="#b7852f"/>
      <text x="41" y="49" fill="#fff" font-weight="700">4</text>
      <text x="88" y="49" fill="#57431d">相反行为</text>
    </g>
    <g transform="translate(72 376)">
      <rect width="500" height="82" rx="20" fill="#efe5c8"/>
      <circle cx="48" cy="41" r="24" fill="#b7852f"/>
      <text x="41" y="49" fill="#fff" font-weight="700">5</text>
      <text x="88" y="49" fill="#57431d">行为激活 / 行为暴露</text>
    </g>
    <g transform="translate(628 376)">
      <rect width="500" height="82" rx="20" fill="#efe5c8"/>
      <circle cx="48" cy="41" r="24" fill="#b7852f"/>
      <text x="41" y="49" fill="#fff" font-weight="700">6</text>
      <text x="88" y="49" fill="#57431d">修正我的思维</text>
    </g>
    <g transform="translate(72 482)">
      <rect width="500" height="82" rx="20" fill="#efe5c8"/>
      <circle cx="48" cy="41" r="24" fill="#b7852f"/>
      <text x="41" y="49" fill="#fff" font-weight="700">7</text>
      <text x="88" y="49" fill="#57431d">睡眠 / 放松训练</text>
    </g>
    <g transform="translate(628 482)">
      <rect width="500" height="82" rx="20" fill="#efe5c8"/>
      <circle cx="48" cy="41" r="24" fill="#b7852f"/>
      <text x="41" y="49" fill="#fff" font-weight="700">8</text>
      <text x="88" y="49" fill="#57431d">预防复发</text>
    </g>
  </g>
</svg>
